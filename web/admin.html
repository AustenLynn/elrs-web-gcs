<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d131a">
  <title data-i18n="gcs.elrs.pilots">GCS ELRS · Pilotos</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="admin">
  <header class="bar">
    <label class="language-settings"><span data-i18n="language">Idioma</span>
      <select id="language" data-language-select aria-label="Idioma" data-i18n-aria-label="language"><option value="es">ES</option><option value="en">EN</option></select></label>
    <h1><span data-i18n="pilots">Pilotos</span></h1>
    <button id="logout" type="button"><span data-i18n="sign.out">Salir</span></button>
  </header>
  <main class="admin-body">
    <ul id="users" class="user-list" aria-live="polite"></ul>
    <form id="add" class="user-add" autocomplete="off">
      <h2><span data-i18n="add.pilot">Agregar piloto</span></h2>
      <input id="new-name" aria-label="Nombre (a-z, 0-9, _ -)" data-i18n-aria-label="name.a.z.0.9" required minlength="2" maxlength="20" pattern="[a-z0-9_\-]{2,20}" placeholder="Nombre (a-z, 0-9, _ -)" data-i18n-placeholder="name.a.z.0.9" autocapitalize="none" spellcheck="false">
      <input id="new-pass" aria-label="Contraseña (mínimo 8)" data-i18n-aria-label="password.minimum.8" type="password" required minlength="8" placeholder="Contraseña (mínimo 8)" data-i18n-placeholder="password.minimum.8" autocomplete="new-password">
      <label class="check"><input id="new-admin" type="checkbox"> admin</label>
      <button type="submit"><span data-i18n="add.pilot">Agregar piloto</span></button>
    </form>
    <p id="msg" class="admin-msg" role="status"></p>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
