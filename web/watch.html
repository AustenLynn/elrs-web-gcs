<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="gcs.elrs.video">GCS ELRS · Video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8edf2; font: 14px system-ui, sans-serif; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .overlay { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; padding: 8px; border-radius: 10px; background: rgba(17, 20, 24, .75); }
    button { font: inherit; color: inherit; background: #2a313a; border: 1px solid #3a4450; border-radius: 8px; padding: 6px 10px; }
    .language-settings { display: inline-flex; align-items: center; gap: 4px; }
    .language-settings > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .language-settings select { font: inherit; color: inherit; background: #2a313a; border: 1px solid #3a4450; border-radius: 8px; padding: 6px; }
    #v-result { flex-basis: 100%; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div class="overlay">
    <label class="language-settings"><span data-i18n="language">Idioma</span>
      <select id="language" data-language-select aria-label="Idioma" data-i18n-aria-label="language"><option value="es">ES</option><option value="en">EN</option></select></label>
    <span id="v-state"><span data-i18n="connecting">conectando…</span></span>
    <span id="v-stats">—</span>
    <button id="v-record"><span data-i18n="record.c4.test.5.min">Grabar prueba C4 (5 min)</span></button>
    <button id="v-download" disabled><span data-i18n="download.csv">Descargar CSV</span></button>
    <span id="v-result"></span>
  </div>
  <script type="module" src="js/watch.js"></script>
</body>
</html>
