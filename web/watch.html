<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GCS ELRS · Video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8edf2; font: 14px system-ui, sans-serif; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .overlay { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; padding: 8px; border-radius: 10px; background: rgba(17, 20, 24, .75); }
    button { font: inherit; color: inherit; background: #2a313a; border: 1px solid #3a4450; border-radius: 8px; padding: 6px 10px; }
    #v-result { flex-basis: 100%; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div class="overlay">
    <span id="v-state">conectando…</span>
    <span id="v-stats">—</span>
    <button id="v-record">Grabar prueba C4 (5 min)</button>
    <button id="v-download" disabled>Descargar CSV</button>
    <span id="v-result"></span>
  </div>
  <script type="module" src="js/watch.js"></script>
</body>
</html>
