# /etc/gcs/crsf-core.conf - crsf-core settings. Every key is documented in core/src/config.h.
# Stable name of the BetaFPV module's USB serial chip (survives re-plugging):
serial_device = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
# Must match what crsf-probe found to work (Milestone 1).
baud = 921600
# The gateway's control socket (one controller; a new connection replaces the old one).
socket_path = /run/crsf-core/core.sock
# Read-only socket for crsf-ctl status/watch: safe to use while flying.
status_socket_path = /run/crsf-core/status.sock
event_log = /var/log/crsf-core/events.jsonl
# Per-frame timing CSV for criterion C1 (~80 MB/hour at 250 Hz). Enable only while measuring:
# timing_log = /var/log/crsf-core/timing.csv
timing_log =
# Armed + no fresh command for this long -> FAILSAFE (criterion C3 budget is 1000 ms).
cmd_timeout_ms = 300
# Aim frames this much earlier than ELRS asks, as headroom for USB latency. Tune with C1 data.
sync_margin_us = 1000
# Frame loop: SCHED_FIFO 80 on CPU 3 (isolated with isolcpus=3). Refuse to run without it.
rt_priority = 80
rt_cpu = 3
rt_required = true
# Flight controller firmware: aquila20 (BetaFPV Aquila20: FAILSAFE disarms over the link,
# CH7 = its stick sensitivity, kept at S) or betaflight (FAILSAFE switch on ch_failsafe).
fc_profile = aquila20
# Channel layout (1-based). Aquila20: CH5 ARM, CH6 flight mode N/S/M, CH7 sensitivity (not
# used). Betaflight: map AETR1234, ARM on AUX1, FAILSAFE mode on AUX3 (ch_failsafe).
ch_roll = 1
ch_pitch = 2
ch_throttle = 3
ch_yaw = 4
ch_arm = 5
ch_mode = 6
ch_failsafe = 7
